name: Construire l'installateur

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: python -m pip install opencv-python pillow reportlab customtkinter pyinstaller

      - name: Construire l'application
        run: python -m PyInstaller --noconfirm --onedir --windowed --name RotoPDF --icon icon.ico --add-data "icon.ico;." --collect-all customtkinter rotopdf.py

      - name: Installer Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Construire l'installateur
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Calculer l'empreinte SHA-256
        run: |
          $h = (Get-FileHash Output\RotoPDF_Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  RotoPDF_Setup.exe" | Out-File -Encoding ascii Output\RotoPDF_Setup.exe.sha256

      - name: Conserver l'installateur (essai manuel)
        uses: actions/upload-artifact@v6
        with:
          name: RotoPDF_Setup
          path: Output/*

      - name: Publier dans la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/RotoPDF_Setup.exe
            Output/RotoPDF_Setup.exe.sha256
